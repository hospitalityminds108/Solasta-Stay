<script>
(function() {
  const path = window.location.pathname.split('/').filter(Boolean);
  
  let itemList = [{
    "@type": "ListItem",
    "position": 1,
    "name": "Home",
    "item": "https://solastastays.com/"
  }];

  let currentURL = "https://solastastays.com";

  path.forEach((segment, index) => {
    currentURL += "/" + segment;

    let name = segment.replace(/-/g, " ");
    name = name.charAt(0).toUpperCase() + name.slice(1);

    itemList.push({
      "@type": "ListItem",
      "position": index + 2,
      "name": name,
      "item": currentURL
    });
  });

  const schema = {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": itemList
  };

  document.getElementById("breadcrumb-schema").textContent = JSON.stringify(schema);
})();
</script>
